<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover" />
    <title>Deepak Prasad — Senior Product Manager | AI, 0→1 & Product Strategy</title>
    <meta name="description" content="Senior Product Manager building AI, B2B and B2C products across marketplaces, subscription platforms, connected products and workflow automation." />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The deployment this site is published to. Update alongside the
         AI Studio deployment if the primary domain ever changes. -->
    <link rel="canonical" href="https://deepakprasad.ai.studio/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://deepakprasad.ai.studio/" />
    <meta property="og:title" content="Deepak Prasad — Senior Product Manager | AI, 0→1 & Product Strategy" />
    <meta property="og:description" content="Senior Product Manager building AI, B2B and B2C products across marketplaces, subscription platforms, connected products and workflow automation." />
    <meta property="og:image" content="https://deepakprasad.ai.studio/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deepak Prasad — Senior Product Manager | AI, 0→1 & Product Strategy" />
    <meta name="twitter:description" content="Senior Product Manager building AI, B2B and B2C products across marketplaces, subscription platforms, connected products and workflow automation." />
    <meta name="twitter:image" content="https://deepakprasad.ai.studio/images/og-image.png" />

    <!-- the hero portrait is the largest paint on every first view, and
         React renders it, so the browser would not find it until the bundle
         ran. Naming it here starts the fetch with the document. -->
    <link rel="preload" as="image" href="/deepak_portrait_4x5.jpg" fetchpriority="high" />

    <!-- v3 faces are self-hosted, so the first paint does not wait on a
         third party. Preloaded because index.css declares them and the
         browser would otherwise find them only after the CSS parses. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-var-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-var-latin.woff2" crossorigin />

    <!-- Archivo and Outfit are still used by the v2 sections. This link
         goes when the last of them is replaced. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
