<!doctype html><html><head><meta charset="utf-8">
<!-- Source for public/images/og-image.png. Regenerate at exactly 1200x630:
     chrome --headless --hide-scrollbars --window-size=1200,630 \
       --virtual-time-budget=8000 --screenshot=og.png scripts/og-image.html
     Keep it in the v2 palette, and keep the domain line in step with the
     canonical URL in index.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=Outfit:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:#0A0A0B;color:#F2F2F0;
       font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
       padding:62px 80px;display:block;
       position:relative;overflow:hidden}
  .orbit{position:absolute;right:-210px;top:-260px;width:760px;height:760px;border-radius:50%;
         border:1px dotted rgba(240,151,122,.26)}
  .eyebrow{display:flex;align-items:center;gap:14px;font-family:'JetBrains Mono',monospace;
           font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:rgba(242,242,240,.72)}
  .eyebrow i{display:block;width:52px;height:1px;background:#F0977A}
  h1{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:900;
     font-variation-settings:'wdth' 108;font-size:104px;line-height:.92;letter-spacing:-.045em;
     margin-top:22px}
  h2{font-family:'Archivo','Helvetica Neue',Arial,sans-serif;font-weight:600;font-style:italic;
     font-size:34px;letter-spacing:-.02em;color:#F0977A;margin-top:16px}
  .spec{font-size:21px;color:#8F8F8D;margin-top:16px}
  .rule{height:1px;background:rgba(242,242,240,.13);margin-top:26px}
  .lower{margin-top:74px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(242,242,240,.13);
         border:1px solid rgba(242,242,240,.13);margin-top:26px}
  .stat{background:#0A0A0B;padding:20px 24px}
  .stat b{display:block;font-family:'Archivo',sans-serif;font-weight:800;font-size:42px;
          letter-spacing:-.03em;color:#F0977A}
  .stat span{display:block;font-family:'JetBrains Mono',monospace;font-size:12px;
             letter-spacing:.13em;text-transform:uppercase;color:#8F8F8D;margin-top:8px}
  footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;
         font-family:'JetBrains Mono',monospace;font-size:14px;letter-spacing:.14em;
         text-transform:uppercase;color:rgba(242,242,240,.5)}
</style></head><body>
  <div class="orbit"></div>
  <div>
    <div class="eyebrow"><i></i>Available for senior and lead product roles</div>
    <h1>DEEPAK PRASAD</h1>
    <h2>Senior Product Manager</h2>
    <div class="spec">Zero to one products, AI systems, B2B marketplaces and consumer subscription.</div>
    <div class="rule"></div>
  </div>
  <div class="lower">
    <div class="stats">
      <div class="stat"><b>80K+</b><span>Farmers onboarded</span></div>
      <div class="stat"><b>12K+</b><span>Paid subscribers</span></div>
      <div class="stat"><b>3,200+</b><span>Daily actives</span></div>
    </div>
    <footer><span>deepakprasad.ai.studio</span><span>7+ years &nbsp;/&nbsp; India &amp; Europe</span></footer>
  </div>
</body></html>
